<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Your pool dome proposal | TheDomeBros</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon-domebros.svg" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-domebros.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#f6f4ef;--card:#fffdf8;--ink:#1f2a37;--mut:#5b6675;--navy:#1f3b73;--navy-d:#162a52;--navy2:#3a5fa8;--line:#e4ddcf;--err:#b3261e}
  *{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;padding:0 0 40px}
  h1,h2,h3,.brand,.btn{font-family:'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em}
  .wrap{width:100%;max-width:620px;margin:0 auto;padding:0 18px}
  .brand{font-weight:800;font-size:22px;color:var(--navy);text-decoration:none;display:inline-block;margin:22px 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 4px 20px rgba(31,42,55,.06);margin-bottom:16px}
  .pill{display:inline-block;background:#e7ecf7;border:1px solid #d4ddf0;color:var(--navy);font-weight:700;font-size:12px;padding:5px 13px;border-radius:999px;margin-bottom:12px}
  h1{font-size:25px;margin:0 0 6px}
  h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
  .sub{color:var(--mut);font-size:14.5px;margin:0 0 4px}
  .loading,.err{color:var(--mut);text-align:center;padding:40px 18px;font-size:14.5px}
  .err{color:var(--err)}
  /* Hero: their dome on their own property. */
  .hero{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#eceadf;margin-bottom:14px}
  .hero img{display:block;width:100%;height:auto}
  /* Summer: their yard with the dome down. */
  .summer .lead{font-size:14px;color:var(--mut);margin:0 0 14px}
  .pair{display:grid;grid-template-columns:1fr;gap:12px;margin:0}
  .pair figure{margin:0}
  .pair img{display:block;width:100%;height:auto;border-radius:14px}
  .pair figcaption{font-size:12.5px;color:var(--mut);margin-top:6px}
  /* Spec rows */
  .spec{list-style:none;margin:0;padding:0}
  .spec li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .spec li:last-child{border-bottom:0}
  .spec .k{color:var(--mut)}
  .spec .v{font-weight:700;text-align:right;line-height:1.42}
  /* Price */
  .price{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:34px;color:var(--navy);margin:2px 0 2px}
  .pricenote{font-size:13px;color:var(--mut)}
  .split{display:flex;gap:10px;margin-top:14px}
  .split div{flex:1;background:#eef1f7;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .split .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .split .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;color:var(--navy);margin-top:2px}
  /* Steps */
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:0 0 16px 38px;font-size:14.5px}
  .steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;
    background:var(--navy);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .steps li b{display:block}
  .steps li span{color:var(--mut);font-size:13.5px}
  /* Gallery */
  /* Phones: a swipeable strip. A 2-up grid crops these to postage stamps, and
     the point of them is the scene. Bleeds to the card edge so it's obvious
     there's more to the right. */
  .gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;margin:0 -22px;padding:2px 22px 6px;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal figure{margin:0;flex:0 0 82%;scroll-snap-align:center}
  .gal img{display:block;width:100%;height:200px;object-fit:cover;border-radius:14px;
    border:1px solid var(--line);cursor:zoom-in}
  /* Tap to see it properly — these are the whole argument. */
  .lb{position:fixed;inset:0;background:rgba(15,23,34,.93);display:none;
    align-items:center;justify-content:center;padding:18px;z-index:60}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lb .x{position:absolute;top:14px;right:16px;width:38px;height:38px;border:0;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;font-size:19px;line-height:38px;cursor:pointer;padding:0}
  /* Benefit list */
  .wins{list-style:none;margin:0;padding:0}
  .wins li{position:relative;padding:0 0 13px 30px;font-size:14.5px}
  .wins li:last-child{padding-bottom:2px}
  .wins li:before{content:"";position:absolute;left:2px;top:6px;width:9px;height:5px;
    border-left:2.5px solid var(--navy2);border-bottom:2.5px solid var(--navy2);transform:rotate(-45deg)}
  .wins li b{display:block}
  .wins li span{color:var(--mut);font-size:13.5px}
  /* Honest trade-offs — deliberately plainer than the benefits above. */
  .real{background:#f2efe7;border:1px solid var(--line)}
  .real h2{color:var(--ink)}
  .real .lead{font-size:14px;color:var(--mut);margin:0 0 14px}
  .real dl{margin:0}
  .real dt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;margin:12px 0 2px}
  .real dt:first-child{margin-top:0}
  .real dd{margin:0;font-size:13.5px;color:var(--mut)}
  /* FAQ */
  details{border-bottom:1px solid var(--line);padding:11px 0}
  details:last-of-type{border-bottom:0}
  summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:after{content:"+";float:right;color:var(--navy2);font-weight:800}
  details[open] summary:after{content:"–"}
  details p{margin:9px 0 2px;font-size:14px;color:var(--mut)}
  /* CTA */
  .btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:15px;
    font-size:16px;font-weight:700;background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(31,42,55,.22)}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none;margin-top:10px}
  .foot{text-align:center;color:var(--mut);font-size:12.5px;padding:6px 18px 0}
  /* Desktop: same single column of cards, each using the extra width inside
     itself. Mobile is untouched — none of this applies below 900px. */
  @media(min-width:900px){
    .wrap{max-width:1080px;padding:0 28px}
    .brand{font-size:24px;margin:28px 0 20px}
    /* No sidebar. A narrow column holding two short cards next to a very long
       one leaves a dead strip down the whole page whatever sticky does — so the
       cards run full width and use the space INSIDE themselves instead. */
    .layout{display:block}
    .side{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;align-items:start}
    /* Lists that were one long thin ribbon now fill the card. */
    .wins{columns:2;column-gap:30px}
    .wins li{break-inside:avoid;padding-bottom:15px}
    .steps{columns:2;column-gap:30px}
    .steps li{break-inside:avoid}
    h1{font-size:30px}
    /* Never crop the render (a tall backyard photo lost the dome to it) and
       never pad it with empty bars: cap the height and let the frame shrink to
       the picture, centred. */
    .hero{width:fit-content;max-width:100%;margin:0 auto 14px}
    .hero img{width:auto;max-width:100%;max-height:620px}
    /* Capped and centred, so a tall backyard photo doesn't fill the screen. */
    .pair{display:flex;justify-content:center;align-items:flex-start;gap:14px}
    .pair figure{flex:0 1 auto}
    .pair img{width:auto;max-width:100%;max-height:420px}
    /* Room to show them all at once — no scrolling to discover the rest. */
    .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:0;overflow:visible}
    .gal figure{flex:none}
    .gal img{height:196px}
    /* Two columns of trade-offs reads better than one long list out here. */
    .real dl{columns:2;column-gap:26px}
    .real dt{break-after:avoid}
    .real dd{break-inside:avoid;margin-bottom:12px}
    /* A pill, a name and one line don't need a card around them at this width —
       boxed, it was a wide empty band above the render. It reads as a page
       heading instead. */
    .intro{background:transparent;border:0;box-shadow:none;padding:0 2px;margin-bottom:14px}
    /* Full-bleed buttons across 1080px look like a mistake. */
    .btn{max-width:400px;margin-left:auto;margin-right:auto}
    /* The columns above already hold the measure; only the FAQ runs full width. */
    details p{max-width:74ch}
  }
  @media print{
    body{background:#fff}
    .card{box-shadow:none;break-inside:avoid}
    .btn,.noprint{display:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">TheDomeBros</a>
  <div id="root"><div class="loading">Loading your proposal&hellip;</div></div>
  <p class="foot">Questions? Text or call <a href="tel:+13852044760">(385)&nbsp;204-4760</a>.</p>
</div>
<div class="lb" id="lb"><button class="x" id="lbX" aria-label="Close">&#10005;</button><img id="lbImg" alt="" /></div>
<script>
var WORKER = "https://quote-form.thedomebros-com.workers.dev";
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var money = function(n){ return "$" + Math.round(n).toLocaleString("en-US"); };

function render(d){
  var h = "";

  // Sent to someone we haven’t quoted yet, this is the same page with a
  // different front: it leads with what a measurement involves and asks for the
  // appointment instead of a signature. The two conditions are separate — a
  // render can exist before a price does, and when it does we still greet them
  // by name rather than like a stranger.
  var quoted = d.price != null;
  var personal = !!(d.name || d.render);

  if (!personal){
    h += '<div class="card intro"><span class="pill">Pool domes · Utah County</span>'
      +  '<h1>Swim all winter, in the pool you already have</h1>'
      +  '<p class="sub">Everything we’d tell you standing in your backyard — the specs, what it actually costs to run, and the parts we’d rather you heard from us. Nothing to fill in.</p></div>';
  } else {
    h += '<div class="card intro"><span class="pill">Your proposal</span>'
      +  '<h1>'+(d.name ? esc(String(d.name).split(" ")[0]) + "’s pool dome" : "Your pool dome")+'</h1>'
      +  '<p class="sub">Everything in one place while you think it over.</p></div>';
  }

  // Their dome, on their property — the whole reason this page works.
  if (d.render){
    h += '<div class="hero"><img src="'+esc(d.render)+'" alt="Your pool dome, shown on your property" /></div>';
  }

  // The same yard with the dome down. "Will it wreck my deck?" is the question
  // behind a lot of hesitation, so answer it with their own yard.
  if (d.render_summer){
    h += '<div class="card summer"><h2>And in summer</h2>'
      +  '<p class="lead">The dome comes down in the spring. All that stays is a row of small anchors set flush in your deck. This is your yard with it down.</p>'
      +  '<div class="pair">'
      +  '<figure><img src="'+esc(d.render_summer)+'" alt="Your yard in summer with the dome down" /><figcaption>Your yard with the dome down</figcaption></figure>'
      +  '</div></div>';
  }

  h += '<div class="layout">';

  // Price and configuration, up top. Someone reading their own proposal has
  // already been measured and already wants it — lead with the decision, not
  // the pitch.
  var rows = [];
  if (d.sqft) rows.push(["Dome footprint", Number(d.sqft).toLocaleString("en-US") + " sq ft"]);
  if (d.pool_size) rows.push(["Your pool", d.pool_size]);
  if (d.options){
    if (d.options.color) rows.push(["Roof color", d.options.color]);
    if (d.options.door) rows.push(["Entry", d.options.door + (d.options.doorCount > 1 ? " × " + d.options.doorCount : "")]);
    if (d.options.heater) rows.push(["Heater", d.options.heater]);
  }

  h += '<aside class="side">';
  // A quote can be a range until the options are locked. Showing the low end as
  // a firm price is how the contract ends up contradicting the proposal.
  if (quoted){
    var ranged = d.price_max != null && d.price_max > d.price;
    var halfLo = money(d.price / 2), halfHi = ranged ? money(d.price_max / 2) : null;
    h += '<div class="card"><h2>Your price</h2>'
      +  '<div class="price">'+(ranged ? money(d.price) + "–" + money(d.price_max) : money(d.price))+'</div>'
      +  '<div class="pricenote">Includes the dome, delivery, and professional installation. Utah sales tax included.</div>'
      +  '<div class="split"><div><div class="l">To get started</div><div class="n">'+(ranged ? halfLo + "–" + halfHi : halfLo)+'</div></div>'
      +  '<div><div class="l">On completion</div><div class="n">'+(ranged ? halfLo + "–" + halfHi : halfLo)+'</div></div></div>'
      +  (ranged ? '<div class="pricenote" style="margin-top:11px">A range until the last measurements and options are settled. Your contract shows one number, and it won’t be higher than the top of this range.</div>' : '')
      +  '</div>';
  }
  if (rows.length){
    h += '<div class="card"><h2>'+(quoted ? "Your dome" : "Your pool")+'</h2><ul class="spec">'
      + rows.map(function(r){ return '<li><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></li>'; }).join("")
      + '</ul></div>';
  }
  h += '</aside>';

  // No quote yet: the next step is the measurement, so say exactly what one is.
  if (!quoted){
    h += '<div class="card"><h2>What a measurement costs you: nothing, and about half an hour</h2><ul class="wins">'
      +  '<li><b>Free, 30 to 60 minutes</b><span>Depending on your setup and how many questions you have.</span></li>'
      +  '<li><b>We check there’s room</b><span>We measure the pool and the deck to confirm the dome fits — the footprint plus the clearance it needs around the edge.</span></li>'
      +  '<li><b>We check how it anchors</b><span>Most decks take standard anchors set flush into the concrete. Some setups need water-based anchors instead, and that’s much better to know now than on install day.</span></li>'
      +  '<li><b>We look at your power</b><span>The blower needs a circuit near the pool. We’d rather find that out with you standing there.</span></li>'
      +  '<li><b>You get a picture of your own dome</b><span>One photo from your deck, and we send back a to-scale render of the dome on your pool.</span></li>'
      +  '<li><b>You get a real price, not a range</b><span>No obligation, and we don’t ask you to decide anything that day.</span></li>'
      +  '</ul></div>';
  }

  // What actually changes for them. Concrete scenes, not adjectives.
  h += '<div class="card"><h2>What changes</h2><ul class="wins">'
    +  '<li><b>You swim in January</b><span>Same water, same yard. It just stops sitting unused the moment the weather turns.</span></li>'
    +  '<li><b>The kids actually use it</b><span>Swim practice, birthdays, a Tuesday after school — in the middle of winter.</span></li>'
    +  '<li><b>Summer is still summer</b><span>It comes down in the spring. You get an open-air pool and a warm one — not a choice between them.</span></li>'
    +  '</ul></div>';

  // The actual product. Published manufacturer figures, not adjectives — a
  // buyer at this price checks, and these hold up when they do.
  h += '<div class="card"><h2>The dome itself</h2><ul class="spec">'
    +  '<li><span class="k">Material</span><span class="v">20 mil PVC, UV-stabilized<br />100% virgin vinyl, made in USA</span></li>'
    +  '<li><span class="k">Wall height</span><span class="v">5 ft 6 in</span></li>'
    +  '<li><span class="k">Center height</span><span class="v">12–14 ft typical<br />(about 11 ft 9 in on a 1,250 sq ft dome)</span></li>'
    +  '<li><span class="k">Anchor cable</span><span class="v">3/16 in vinyl-coated, 3,000 lb rated<br />sealed into an 18 oz reinforced hem</span></li>'
    +  '<li><span class="k">Anchors</span><span class="v">Flush 1/2 in sleeves every 3 ft<br />removable eyebolts, stainless plugs</span></li>'
    +  '<li><span class="k">Blower</span><span class="v">1/3–1/2 HP, 2,500–3,000 CFM<br />115V, pressure switch, 2 thermal cutoffs</span></li>'
    +  '<li><span class="k">Heater</span><span class="v">Water-fed off your pool heater’s return<br />needs no electricity of its own</span></li>'
    +  '<li><span class="k">Cold weather</span><span class="v">Performs well to about −10°F</span></li>'
    +  '<li><span class="k">Lifespan</span><span class="v">9–12 years in a climate like ours</span></li>'
    +  '<li><span class="k">Warranty</span><span class="v">3 years — year one in full,<br />years two and three prorated</span></li>'
    +  '<li><span class="k">Made by</span><span class="v">Ameri-Brand Products<br />Oroville, California, since 1998</span></li>'
    +  '</ul></div>';

  // Running costs, with the big one named rather than glossed. Quoting the
  // blower figure alone would read as the whole answer, and it isn't.
  h += '<div class="card"><h2>What it costs to run</h2><ul class="wins">'
    +  '<li><b>The blower: $28–35 a month</b><span>The manufacturer’s own figure. It doesn’t run constantly — a pressure switch kicks it on when the pressure drops and off again at full inflation.</span></li>'
    +  '<li><b>Heating the pool: more than that, and it depends on you</b><span>This is the real running cost and we’re not going to pretend otherwise. It comes down to your pool, your gas rate and how warm you keep it. The dome traps heat and all but stops evaporation, so the heat you pay for goes much further than on an open pool — ask us and we’ll work out a number for your pool specifically.</span></li>'
    +  '<li><b>Takedown, storage and reinstall: optional, priced separately</b><span>Not included in the price above. You can do it yourself — the manufacturer reckons about six hours with a couple of helpers — or we’ll handle it. Ask us what it runs for your dome.</span></li>'
    +  '<li><b>A zipper every 4 to 5 years</b><span>The replacement panel ships with your dome and lives in your garage, so you’re paying for the visit, not the part.</span></li>'
    +  '</ul></div>';

  // The trade-offs. Every one of these comes up eventually — better it comes
  // from us now than from a neighbor after they’ve signed.
  h += '<div class="card real"><h2>Straight talk</h2>'
    +  '<p class="lead">Things we’d rather you hear from us than find out in January.</p><dl>'
    +  '<dt>It’s big, and your neighbors will notice</dt>'
    +  '<dd>It covers your pool and stands well above it. If you’re in an HOA, check the rules before you sign — we’d rather lose the sale than have you fight that fight afterwards.</dd>'
    +  '<dt>We drill into your deck</dt>'
    +  '<dd>Anchor sleeves go into the concrete every three feet, and they stay there for good. In the summer the eyebolts come out and stainless plugs sit flush, so the deck is flat and clear — but the holes are permanent.</dd>'
    +  '<dt>A second entry has to be decided now</dt>'
    +  '<dd>One zippered entry is standard. If you want a second one, or an L-entry for getting furniture in and out, it has to be ordered with the dome. Adding one later means the dome goes back to the factory, and it’s expensive.</dd>'
    +  '<dt>Seasonal service isn’t included</dt>'
    +  '<dd>The price above covers the dome, delivery and installation. Taking it down each spring, storing it and putting it back up is a separate service you can buy from us or do yourself.</dd>'
    +  '<dt>Your pool equipment stays outside</dt>'
    +  '<dd>The pump and plumbing can’t go under the dome — too noisy — so they stay out in the cold. Things can break down out there over a hard winter. If that happens, we can take care of it.</dd>'
    +  '<dt>Zippers are a wear item</dt>'
    +  '<dd>The zipper is deliberately the weakest part of the dome — if something has to give, better it’s that than the vinyl. Expect to replace it every four to five years, and it’s the one part the manufacturer’s warranty doesn’t cover. The spare panel comes with your dome.</dd>'
    +  '<dt>The heater has to be drained in a hard freeze</dt>'
    +  '<dd>If the power goes out at 25°F or colder, water sitting in the heater can freeze and split the coil, and the coil maker won’t warrant that. There’s a straightforward way to mount it so it drains itself if the power drops — ask us about it when you’re deciding on the heater.</dd>'
    +  '</dl></div>';

  // What happens next, with the lead time stated. The production queue is the
  // real constraint, and a date we confirm beats a date we imply.
  h += '<div class="card"><h2>What happens next</h2><ol class="steps">'
    +  '<li><b>You sign</b><span>Review the agreement and sign online. You have three business days to change your mind.</span></li>'
    +  '<li><b>50% deposit</b><span>This reserves your dome and locks your price.</span></li>'
    +  '<li><b>It gets built</b><span>Every dome is cut to your pool’s measurements, so nothing ships off a shelf. Figure one to four months depending on how loaded the factory is when you order — their first and fourth quarters are the busiest. We confirm your date in writing rather than guess at it.</span></li>'
    +  '<li><b>Install day</b><span>Our crew handles the whole thing — most installs are done in a day. You don’t need to do anything but clear the pool deck and let us in.</span></li>'
    +  '<li><b>You swim</b><span>Remaining balance is due once it’s up and you’re happy.</span></li>'
    +  '</ol></div>';

  // Winter only — a summer photo of a pool sells nothing, everyone has already
  // pictured that. And not “domes we’ve installed”: these are the
  // manufacturer’s, and this page is written material we have to stand behind.
  h += '<div class="card"><h2>Picture your winter</h2><div class="gal">'
    +  shot("/Images/pool-dome-winter.webp", "Pool dome lit from inside, backyard under snow")
    +  shot("/Images/inside-dome-winter.webp", "Steam rising off a heated pool inside the dome, snow outside")
    +  shot("/Images/roof-aqua.webp", "Aqua pool dome in deep snow surrounded by pines")
    +  shot("/Images/roof-blue-striped.webp", "Blue and white striped pool dome in a backyard in late fall")
    +  shot("/Images/roof-blue.webp", "Blue pool dome filling a suburban backyard")
    +  shot("/Images/roof-white.webp", "White pool dome on a landscaped property")
    +  '</div><p class="pricenote" style="margin-top:12px">These are the manufacturer’s installs, not ours — we won’t pass off someone else’s backyard as our work.</p></div>';

  // FAQ — the questions that stall a decision.
  h += '<div class="card"><h2>Common questions</h2>'
    +  faq("What's it like inside?",
          "Roomier than it looks. The walls stand 5 ft 6 in and the middle comes up to 12–14 feet on a typical dome, so you're walking around under it rather than stooping. A clear window band runs the whole way around, so it reads more like a sunroom than a tent.")
    +  faq("Why not buy one direct from the manufacturer?",
          "You can — they'll sell you one. What you'd be taking on is the install: drilling and setting anchors every three feet in your deck, a six-hour build with helpers you have to find, and a warranty that doesn't even start until the factory receives and acknowledges your install photos. We do that part, we submit the warranty paperwork, we're twenty minutes away when something tears in February, and we can take the dome down and store it for you. If none of that is worth anything to you, buying direct is the cheaper road and we'd rather say so.")
    +  faq("Do we have to leave it up all winter?",
          "No — you don't have to leave it inflated at all. Plenty of owners switch the blower on about thirty minutes before they swim, and off again afterwards. Either way the pool never gets winterized and buried for six months.")
    +  faq("What if the power goes out while we're in there?",
          "It comes down gradually, never suddenly, and how fast depends on size — a small dome settles in 3 to 5 minutes, a 1,500 sq ft one takes 15 to 20. Either way there's time to walk out, and it re-inflates in about half an hour once the power is back. We'll tell you the number for your dome at the walkthrough.")
    +  faq("Won't it blow away?",
          "It's designed to handle a typical windstorm, and owners regularly report riding out 60 mph gusts — though the manufacturer's own advice is not to push that. In a severe storm the right move is to switch the blower off: the dome settles onto the water and rides it out like a pool cover. The zipper is deliberately the weakest point, so an extreme gust costs you a zipper rather than the whole dome.")
    +  faq("What about heavy snow?",
          "Light and medium snow melts off on its own from the warmth coming off the pool. In a real storm you can switch the blower off and let it settle onto the water. If you're away, the snow slowly presses it down to the surface, melts against the warm water, and it re-inflates on its own because the blower is still running. It works down to about −10°F. One thing to be straight about: watching the weather is on you, not on us — that's in the agreement, and we'd rather point at it now than after a storm.")
    +  faq("How long will it last?",
          "9–12 years in a cold climate like ours. Heat is what wears vinyl out, not cold — a dome here will outlive the same one in a desert state.")
    +  faq("What's the warranty?",
          "Three years — the first year in full, the following two prorated against current retail. It covers defects, materials and weld separation, and it doesn't cover zippers, tears or punctures. It only starts once the factory has your install photos and acknowledges them, which is paperwork we handle for you.")
    +  faq("Is it safe with kids around?",
          "The entry zips shut and takes a padlock, so the water isn't open to curious kids or pets when you're not out there. It's a real physical barrier, though not a code-rated safety cover, and it doesn't replace whatever pool fencing your city requires.")
    +  faq("What happens in the summer?",
          "It comes down and goes into storage. The anchor sleeves stay in the deck with stainless plugs sitting flush, so your deck is flat and clear all summer — nothing to trip over.")
    +  faq("What if we move?",
          "It comes with you — it's equipment, not a structure, and the anchors are the only thing that stays behind. If you'd rather not take it, tell us and we'll help you sell it on.")
    +  faq("What if I change my mind?",
          "You have three business days after signing to cancel, in writing, for a full refund of anything paid.")
    +  '</div>';

  // Who they'd be handing a deposit to. New company, big number — this is the
  // cheapest credibility we have and it was sitting in the contract unused.
  h += '<div class="card"><h2>Who you’re dealing with</h2>'
    +  '<p class="sub" style="margin-bottom:12px">We’re three brothers in Cedar Hills. One number, and one of us picks it up.</p>'
    +  '<ul class="spec">'
    +  '<li><span class="k">TheDomeBros LLC</span><span class="v">4558 W 9820 N<br />Cedar Hills, Utah 84062</span></li>'
    +  '<li><span class="k">Utah contractor license</span><span class="v">DOPL 14296899-5501<br />Classification S330</span></li>'
    +  '<li><span class="k">Liability insurance</span><span class="v">$1M per occurrence<br />$2M aggregate — certificate on request</span></li>'
    +  '<li><span class="k">Phone</span><span class="v"><a href="tel:+13852044760">(385) 204-4760</a></span></li>'
    +  '</ul></div>';

  // CTA
  if (d.contract){
    h += '<div class="card noprint"><h2>Ready when you are</h2>'
      +  '<p class="sub" style="margin-bottom:14px">You can review and sign right here. Or don’t yet — ask us the awkward question first and sign when you’re actually sure. We’d rather have a happy customer than a fast one.</p>'
      +  '<a class="btn" href="'+esc(d.contract)+'">Review &amp; sign</a>'
      +  '<a class="btn ghost" href="sms:+13852044760">Text us a question</a>'
      +  '<p class="foot" style="padding-top:14px">Deciding this with someone else? Send them this page — the link works for them too.</p></div>';
  } else if (!quoted){
    h += '<div class="card noprint"><h2>Want to know what it’d cost on your pool?</h2>'
      +  '<p class="sub" style="margin-bottom:14px">Half an hour, no charge, and you get a picture of your own dome out of it. We don’t ask you to decide anything that day.</p>'
      +  '<a class="btn" href="sms:+13852044760">Book a free measurement</a>'
      +  '<a class="btn ghost" href="tel:+13852044760">Call us instead</a>'
      +  '<p class="foot" style="padding-top:14px">Deciding this with someone else? Send them this page — the link works for them too.</p></div>';
  } else {
    h += '<div class="card noprint"><h2>Questions?</h2>'
      +  '<p class="sub" style="margin-bottom:14px">We’d rather answer them than have you guess.</p>'
      +  '<a class="btn ghost" href="sms:+13852044760">Text us</a>'
      +  '<p class="foot" style="padding-top:14px">Deciding this with someone else? Send them this page — the link works for them too.</p></div>';
  }

  h += '</div>';   // /layout

  document.getElementById("root").innerHTML = h;
}
function faq(q, a){ return '<details><summary>'+esc(q)+'</summary><p>'+esc(a)+'</p></details>'; }
function shot(src, alt){
  return '<figure><img src="'+src+'" alt="'+esc(alt)+'" loading="lazy" /></figure>';
}

// Tap any gallery shot to see it full size. Delegated, because the gallery is
// rendered after this runs.
(function(){
  var lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
  function close(){ lb.classList.remove("open"); lbImg.src = ""; document.body.style.overflow = ""; }
  document.addEventListener("click", function(e){
    var img = e.target.closest && e.target.closest(".gal img");
    if (img){ lbImg.src = img.src; lbImg.alt = img.alt || ""; lb.classList.add("open"); document.body.style.overflow = "hidden"; return; }
    if (e.target === lb || e.target.id === "lbX") close();
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });
})();

// Our own browsers don't count as the customer reading their proposal. Open
// this page once with ?team=1 on a phone or laptop and it stays marked (?team=0
// undoes it) — every visit from it after that is left out of the tally.
function teamBrowser(){
  var q = new URLSearchParams(location.search).get("team");
  try{
    if (q === "1") localStorage.setItem("tdb_team", "1");
    else if (q === "0") localStorage.removeItem("tdb_team");
    return localStorage.getItem("tdb_team") === "1";
  }catch(e){ return q === "1"; }
}

(async function(){
  var team = teamBrowser();
  var t = new URLSearchParams(location.search).get("t") || "";
  if (!t){
    document.getElementById("root").innerHTML = team
      ? '<div class="err">This browser is marked as ours — proposal visits from it won\u2019t be counted. Open this page with ?team=0 to undo it.</div>'
      : '<div class="err">This link is missing its code. Please use the link we sent you.</div>';
    return;
  }
  try{
    var res = await fetch(WORKER + "/proposal", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t, team: team })
    });
    var d = await res.json();
    if (!res.ok || !d.ok){ throw new Error(d.error || "not found"); }
    render(d);
  }catch(e){
    document.getElementById("root").innerHTML =
      '<div class="err">We couldn’t load this proposal. Text us at (385)&nbsp;204-4760 and we’ll send you a fresh link.</div>';
  }
})();
</script>
