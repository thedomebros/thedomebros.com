<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Your pool dome proposal | TheDomeBros</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon-domebros.svg" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon-domebros.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--cream:#f6f4ef;--card:#fffdf8;--ink:#1f2a37;--mut:#5b6675;--navy:#1f3b73;--navy-d:#162a52;--navy2:#3a5fa8;--line:#e4ddcf;--err:#b3261e}
  *{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;padding:0 0 40px}
  h1,h2,h3,.brand,.btn{font-family:'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.02em}
  .wrap{width:100%;max-width:620px;margin:0 auto;padding:0 18px}
  .brand{font-weight:800;font-size:22px;color:var(--navy);text-decoration:none;display:inline-block;margin:22px 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px;box-shadow:0 4px 20px rgba(31,42,55,.06);margin-bottom:16px}
  .pill{display:inline-block;background:#e7ecf7;border:1px solid #d4ddf0;color:var(--navy);font-weight:700;font-size:12px;padding:5px 13px;border-radius:999px;margin-bottom:12px}
  h1{font-size:25px;margin:0 0 6px}
  h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
  .sub{color:var(--mut);font-size:14.5px;margin:0 0 4px}
  .loading,.err{color:var(--mut);text-align:center;padding:40px 18px;font-size:14.5px}
  .err{color:var(--err)}
  /* Hero: their dome on their own property. */
  .hero{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#eceadf;margin-bottom:14px}
  .hero img{display:block;width:100%;height:auto}
  .herocap{font-size:12.5px;color:var(--mut);padding:9px 13px;background:var(--card)}
  /* Spec rows */
  .spec{list-style:none;margin:0;padding:0}
  .spec li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .spec li:last-child{border-bottom:0}
  .spec .k{color:var(--mut)}
  .spec .v{font-weight:700;text-align:right}
  /* Price */
  .price{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:34px;color:var(--navy);margin:2px 0 2px}
  .pricenote{font-size:13px;color:var(--mut)}
  .split{display:flex;gap:10px;margin-top:14px}
  .split div{flex:1;background:#eef1f7;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .split .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .split .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:17px;color:var(--navy);margin-top:2px}
  /* Steps */
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:0 0 16px 38px;font-size:14.5px}
  .steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;
    background:var(--navy);color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .steps li b{display:block}
  .steps li span{color:var(--mut);font-size:13.5px}
  /* Gallery */
  /* Phones: a swipeable strip. A 2-up grid crops these to postage stamps, and
     the point of them is the scene. Bleeds to the card edge so it's obvious
     there's more to the right. */
  .gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;margin:0 -22px;padding:2px 22px 6px;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal figure{margin:0;flex:0 0 82%;scroll-snap-align:center}
  .gal img{display:block;width:100%;height:200px;object-fit:cover;border-radius:14px;
    border:1px solid var(--line);cursor:zoom-in}
  /* Tap to see it properly — these are the whole argument. */
  .lb{position:fixed;inset:0;background:rgba(15,23,34,.93);display:none;
    align-items:center;justify-content:center;padding:18px;z-index:60}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lb .x{position:absolute;top:14px;right:16px;width:38px;height:38px;border:0;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;font-size:19px;line-height:38px;cursor:pointer;padding:0}
  /* Benefit list */
  .wins{list-style:none;margin:0;padding:0}
  .wins li{position:relative;padding:0 0 13px 30px;font-size:14.5px}
  .wins li:last-child{padding-bottom:2px}
  .wins li:before{content:"";position:absolute;left:2px;top:6px;width:9px;height:5px;
    border-left:2.5px solid var(--navy2);border-bottom:2.5px solid var(--navy2);transform:rotate(-45deg)}
  .wins li b{display:block}
  .wins li span{color:var(--mut);font-size:13.5px}
  /* Honest trade-offs — deliberately plainer than the benefits above. */
  .real{background:#f2efe7;border:1px solid var(--line)}
  .real h2{color:var(--ink)}
  .real .lead{font-size:14px;color:var(--mut);margin:0 0 14px}
  .real dl{margin:0}
  .real dt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;margin:12px 0 2px}
  .real dt:first-child{margin-top:0}
  .real dd{margin:0;font-size:13.5px;color:var(--mut)}
  /* FAQ */
  details{border-bottom:1px solid var(--line);padding:11px 0}
  details:last-of-type{border-bottom:0}
  summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary:after{content:"+";float:right;color:var(--navy2);font-weight:800}
  details[open] summary:after{content:"–"}
  details p{margin:9px 0 2px;font-size:14px;color:var(--mut)}
  /* CTA */
  .btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:999px;padding:15px;
    font-size:16px;font-weight:700;background:var(--navy);color:#fff;box-shadow:0 8px 22px rgba(31,42,55,.22)}
  .btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);box-shadow:none;margin-top:10px}
  .foot{text-align:center;color:var(--mut);font-size:12.5px;padding:6px 18px 0}
  /* Desktop: the narrative runs down the left, and what they're deciding on —
     the spec and the price — rides alongside it in a column that stays put as
     they scroll. Mobile order is untouched: the grid collapses to one column and
     the cards fall back into their original sequence. */
  @media(min-width:900px){
    .wrap{max-width:1080px;padding:0 28px}
    .brand{font-size:24px;margin:28px 0 20px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:22px;align-items:start}
    .layout > .card{grid-column:1}
    .layout > .side{grid-column:2}
    .side{position:sticky;top:20px}
    h1{font-size:30px}
    .hero img{max-height:460px;object-fit:cover}
    /* Room to show them all at once — no scrolling to discover the rest. */
    .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:0;overflow:visible}
    .gal figure{flex:none}
    .gal img{height:150px}
    /* Two columns of trade-offs reads better than one long list out here. */
    .real dl{columns:2;column-gap:26px}
    .real dt{break-after:avoid}
    .real dd{break-inside:avoid;margin-bottom:12px}
  }
  @media print{
    body{background:#fff}
    .card{box-shadow:none;break-inside:avoid}
    .btn,.noprint{display:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="/">TheDomeBros</a>
  <div id="root"><div class="loading">Loading your proposal&hellip;</div></div>
  <p class="foot">Questions? Text or call <a href="tel:+13852044760">(385)&nbsp;204-4760</a>.</p>
</div>
<div class="lb" id="lb"><button class="x" id="lbX" aria-label="Close">&#10005;</button><img id="lbImg" alt="" /></div>
<script>
var WORKER = "https://quote-form.thedomebros-com.workers.dev";
var esc = function(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
var money = function(n){ return "$" + Math.round(n).toLocaleString("en-US"); };
// The caption is just there to say "this is your place" — the postcode adds
// nothing and makes it read like a database record.
function streetOf(a){
  return String(a || "").replace(/\s*\d{5}(-\d{4})?\s*$/, "").replace(/[,\s]+$/, "").trim();
}

function render(d){
  var h = "";

  h += '<div class="card"><span class="pill">Your proposal</span>'
    +  '<h1>'+(d.name ? esc(String(d.name).split(" ")[0]) + "’s pool dome" : "Your pool dome")+'</h1>'
    +  '<p class="sub">Everything in one place while you think it over. Nothing here expires — take your time.</p></div>';

  // Their dome, on their property — the whole reason this page works. Sits under
  // their name, so the page opens by saying who it's for and then showing them.
  if (d.render){
    h += '<div class="hero"><img src="'+esc(d.render)+'" alt="Your pool dome, shown on your property" />'
      +  '<div class="herocap">Your dome, rendered on your property'
      +  (streetOf(d.address) ? " &middot; " + esc(streetOf(d.address)) : "") + '.</div></div>';
  }

  h += '<div class="layout">';

  // What actually changes for them. Concrete scenes, not adjectives.
  h += '<div class="card"><h2>What changes</h2><ul class="wins">'
    +  '<li><b>You swim in January</b><span>Same water, same yard — it just stops sitting unused the moment the weather turns.</span></li>'
    +  '<li><b>The kids actually use it</b><span>Swim practice, birthdays, a Tuesday after school — in the middle of winter.</span></li>'
    +  '<li><b>Your pool stays clean</b><span>Leaves, dust and storm debris stay outside. Less skimming, less vacuuming, fewer chemicals chasing what blew in.</span></li>'
    +  '<li><b>Heat stays in the water</b><span>An open pool loses most of its heat to evaporation overnight. Covering it keeps the warmth — and the water — where you put it.</span></li>'
    +  '<li><b>It’s bright inside</b><span>A clear window band runs the whole way around, so it feels like a sunroom rather than a tent.</span></li>'
    +  '<li><b>Warm the moment you step out</b><span>Inside stays warm and humid, so getting out of the water doesn’t mean getting cold. It feels closer to a resort pool than a backyard one.</span></li>'
    +  '<li><b>Summer is still summer</b><span>It comes down when the weather turns, so you get an open-air pool all summer and a warm one all winter. You’re not choosing between them.</span></li>'
    +  '<li><b>Quieter than people expect</b><span>The blower isn’t running non-stop. It cycles on periodically to keep the pressure up, then shuts off again — so it isn’t a constant fan noise in the yard.</span></li>'
    +  '<li><b>Nothing gets built</b><span>Air holds it up — no posts, no footings, no permits for a permanent structure, nothing bolted through your deck.</span></li>'
    +  '</ul></div>';

  // Configuration
  var rows = [];
  if (d.sqft) rows.push(["Dome size", d.sqft.toLocaleString("en-US") + " sq ft"]);
  else if (d.pool_size) rows.push(["Pool size", d.pool_size]);
  if (d.options){
    if (d.options.color) rows.push(["Roof color", d.options.color]);
    if (d.options.door) rows.push(["Door", d.options.door + (d.options.doorCount > 1 ? " × " + d.options.doorCount : "")]);
    if (d.options.heater) rows.push(["Heater", d.options.heater]);
  }
  h += '<aside class="side">';
  if (rows.length){
    // Show the roof they chose on a real dome — the render above is their yard,
    // this is the colour on something already built.
    var roof = d.options && ROOF_SHOTS[d.options.color];
    h += '<div class="card"><h2>What you picked</h2><ul class="spec">'
      + rows.map(function(r){ return '<li><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></li>'; }).join("")
      + '</ul>'
      + (roof ? '<figure style="margin:16px 0 0"><img src="/Images/'+roof+'.webp" alt="'+esc(d.options.color)+'" loading="lazy" class="zoom" '
              + 'style="display:block;width:100%;border-radius:14px;border:1px solid var(--line);cursor:zoom-in" />'
              + '<figcaption style="font-size:12px;color:var(--mut);margin-top:6px">'+esc(d.options.color)+', on a dome that’s already up.</figcaption></figure>' : '')
      + '</div>';
  }

  // Price — the exact quote, matching the contract.
  if (d.price != null){
    var half = d.price / 2;
    h += '<div class="card"><h2>Your price</h2>'
      +  '<div class="price">'+money(d.price)+'</div>'
      +  '<div class="pricenote">Includes the dome, delivery, and professional installation. Utah sales tax included.</div>'
      +  '<div class="split"><div><div class="l">To get started</div><div class="n">'+money(half)+'</div></div>'
      +  '<div><div class="l">On completion</div><div class="n">'+money(half)+'</div></div></div></div>';
  }

  h += '</aside>';

  // The trade-offs. Every one of these comes up eventually — better it comes
  // from us now than from a neighbor after they've signed.
  h += '<div class="card real"><h2>Straight talk</h2>'
    +  '<p class="lead">Things we’d rather you hear from us than find out in January.</p><dl>'
    +  '<dt>It’s big, and your neighbors will notice</dt>'
    +  '<dd>It covers your pool and stands well above it. If you’re in an HOA, check the rules before you sign — we’d rather lose the sale than have you fight that fight afterwards.</dd>'
    +  '<dt>It’s seasonal work, not a one-off</dt>'
    +  '<dd>It goes up in the fall and comes down in the spring. That’s a job each way — we handle it, but it’s a date in the calendar and a cost to plan for, every year.</dd>'
    +  '</dl></div>';

  // What happens next
  h += '<div class="card"><h2>What happens next</h2><ol class="steps">'
    +  '<li><b>You sign</b><span>Review the agreement and sign online — no pressure, and you have three days to change your mind.</span></li>'
    +  '<li><b>50% deposit</b><span>This reserves your dome and locks your price.</span></li>'
    +  '<li><b>We schedule your install</b><span>We’ll pick a date that works and confirm it with you.</span></li>'
    +  '<li><b>Install day</b><span>Our crew handles the whole thing — most installs are done in a day. You don’t need to do anything but let us in.</span></li>'
    +  '<li><b>You swim</b><span>Remaining balance is due once it’s up and you’re happy.</span></li>'
    +  '</ol></div>';

  // Real installs
  // The first two are the same backyard in summer and in deep snow — that pair
  // makes the case better than any sentence does.
  // Winter only — a summer photo of a pool sells nothing, everyone has already
  // pictured that. And not "domes we've installed": we haven't yet, and this
  // page is written material we have to stand behind. The last four are real
  // installs, one per roof color.
  h += '<div class="card"><h2>Picture your winter</h2><div class="gal">'
    +  shot("/Images/pool-dome-winter.webp", "Pool dome lit from inside, backyard under snow")
    +  shot("/Images/inside-dome-winter.webp", "Steam rising off a heated pool inside the dome, snow outside")
    +  shot("/Images/roof-aqua.webp", "Aqua pool dome in deep snow surrounded by pines")
    +  shot("/Images/roof-blue-striped.webp", "Blue and white striped pool dome in a backyard in late fall")
    +  shot("/Images/roof-blue.webp", "Blue pool dome filling a suburban backyard")
    +  shot("/Images/roof-white.webp", "White pool dome on a landscaped property")
    +  '</div></div>';

  // FAQ — the questions that stall a decision.
  h += '<div class="card"><h2>Common questions</h2>'
    +  faq("Will it hold up to snow and wind?", "Air-supported domes are built for winters like ours — the air pressure inside is what carries snow and wind load, rather than a frame.")
    +  faq("How long does it last?", "With normal seasonal care, these are a multi-season investment. Your agreement covers the manufacturer’s warranty, which we administer for you.")
    +  faq("Do you take it down in the summer?", "Yes — we offer seasonal removal, storage and reinstallation as a separate service so you get an open pool in summer and a warm one in winter.")
    +  faq("What if I change my mind?", "You have three business days after signing to cancel, in writing, for a full refund of anything paid.")
    +  '</div>';

  h += '</div>';   // /layout

  // CTA
  if (d.contract){
    h += '<div class="card noprint"><h2>Ready when you are</h2>'
      +  '<p class="sub" style="margin-bottom:14px">You can review and sign right here. Or don’t yet — read the straight talk above again, ask us the awkward question, and sign when you’re actually sure. We’d rather have a happy customer than a fast one.</p>'
      +  '<a class="btn" href="'+esc(d.contract)+'">Review &amp; sign</a>'
      +  '<a class="btn ghost" href="sms:+13852044760">Text us a question</a></div>';
  } else {
    h += '<div class="card noprint"><h2>Questions?</h2>'
      +  '<p class="sub" style="margin-bottom:14px">We’d rather answer them than have you guess.</p>'
      +  '<a class="btn ghost" href="sms:+13852044760">Text us</a></div>';
  }

  document.getElementById("root").innerHTML = h;
}
function faq(q, a){ return '<details><summary>'+esc(q)+'</summary><p>'+esc(a)+'</p></details>'; }
// A real photo of the roof color they chose. Only the colors we actually have a
// good shot of — a missing one shows nothing rather than the wrong dome.
var ROOF_SHOTS = {
  "Solid Aqua Roof": "roof-aqua",
  "Solid Blue Roof": "roof-blue",
  "Solid Tan Roof": "roof-tan",
  "Solid White Roof": "roof-white",
  "Blue & White Striped Roof": "roof-blue-striped"
};
function shot(src, alt){
  return '<figure><img src="'+src+'" alt="'+esc(alt)+'" loading="lazy" /></figure>';
}

// Tap any gallery shot to see it full size. Delegated, because the gallery is
// rendered after this runs.
(function(){
  var lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
  function close(){ lb.classList.remove("open"); lbImg.src = ""; document.body.style.overflow = ""; }
  document.addEventListener("click", function(e){
    var img = e.target.closest && e.target.closest(".gal img, img.zoom");
    if (img){ lbImg.src = img.src; lbImg.alt = img.alt || ""; lb.classList.add("open"); document.body.style.overflow = "hidden"; return; }
    if (e.target === lb || e.target.id === "lbX") close();
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") close(); });
})();

(async function(){
  var t = new URLSearchParams(location.search).get("t") || "";
  if (!t){ document.getElementById("root").innerHTML = '<div class="err">This link is missing its code. Please use the link we sent you.</div>'; return; }
  try{
    var res = await fetch(WORKER + "/proposal", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t })
    });
    var d = await res.json();
    if (!res.ok || !d.ok){ throw new Error(d.error || "not found"); }
    render(d);
  }catch(e){
    document.getElementById("root").innerHTML =
      '<div class="err">We couldn’t load this proposal. Text us at (385)&nbsp;204-4760 and we’ll send you a fresh link.</div>';
  }
})();
</script>
</body>
</html>
